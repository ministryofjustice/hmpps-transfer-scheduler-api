info:
  name: Get transfer history
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/transfers/{{transfer_id}}/history"
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
